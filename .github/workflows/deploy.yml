name: פרסום האתר
# מפרסם את דַּבֵּר ל-GitHub Pages בכל דחיפה ל-main.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: הכנת קבצי האתר
        run: |
          mkdir _site
          for f in $(ls -A); do case "$f" in .git|.github|_site|README.md|firestore-daber.rules|firestore-full.rules|PROJECT_STATUS.md) ;; *) cp -r "$f" _site/ ;; esac; done
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
