name: פרסום האתר
# מפרסם את דַּבֵּר ל-GitHub Pages בכל דחיפה ל-main.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: הכנסת המפתח מהכספת
        # אותו מפתח Firebase של אפליקציית הטיול (Settings → Secrets → FIREBASE_API_KEY). בלעדיו האתר עובד בלי התחברות.
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then echo "::warning::חסר הסוד FIREBASE_API_KEY. האתר יעלה בלי התחברות למשתמשים."; exit 0; fi
          python3 - <<'PY'
          import os, re
          s = open('config.js', encoding='utf-8').read()
          s, n = re.subn(r'''((?:apiKey|key)\s*:\s*)(['"])[^'"]*\2''', lambda m: m.group(1) + m.group(2) + os.environ['FIREBASE_API_KEY'] + m.group(2), s, count=1)
          assert n == 1, 'key line not found in config.js'
          open('config.js', 'w', encoding='utf-8').write(s)
          PY
      - name: הכנת קבצי האתר
        run: |
          mkdir _site
          for f in $(ls -A); do case "$f" in .git|.github|_site|README.md|firestore-daber.rules|firestore-full.rules|PROJECT_STATUS.md) ;; *) cp -r "$f" _site/ ;; esac; done
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
