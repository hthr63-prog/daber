.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}

שר לפתוח את החלון, בבקשה?", "focus": "Can I", "distractors": ["Do I can", "I can", "Am I can"], "alts": ["May I open the window, please?", "Could I open the window, please?"]}, {"en": "Should we take a taxi or the bus?", "he": "כדאי לנו לקחת מונית או אוטובוס?", "focus": "Should we", "distractors": ["We should", "Do we should", "Should we to"], "alts": []}, {"en": "Students must wear a uniform at this school.", "he": "התלמידים חייבים ללבוש תלבושת אחידה בבית הספר הזה.", "focus": "must wear", "distractors": ["must to wear", "must wearing", "musts wear"], "alts": ["Students have to wear a uniform at this school."]}, {"en": "Does she have to work on Saturday?", "he": "היא צריכה לעבוד בשבת?", "focus": "have to", "distractors": ["has to", "must", "have"], "alts": []}, {"en": "You shouldn't eat so much sugar.", "he": "לא כדאי לכם לאכול כל כך הרבה סוכר.", "focus": "shouldn't eat", "distractors": ["shouldn't to eat", "don't should eat", "shouldn't eats"], "alts": []}]}, {"id": "pastprog", "level": "B1", "title": "עבר מתמשך · Past Progressive", "intro": ["משתמשים בעבר מתמשך לפעולה שהייתה באמצע, ברגע מסוים בעבר: At eight o'clock I was eating dinner.", "המבנה: was/were + פועל עם ing. was עם I/he/she/it, ו-were עם you/we/they.", "פעולה ארוכה שנקטעה בפעולה קצרה: I was walking home when it started to rain. הארוכה בעבר מתמשך, הקצרה בעבר פשוט.", "while בא לרוב לפני הפעולה הארוכה, ו-when לפני הקצרה: While I was cooking, the phone rang.", "בעברית 'הלכתי' משמש לשני המקרים. באנגלית שואלים: הפעולה הייתה באמצע? אז was/were + ing."], "table": [{"form": "I/he/she/it", "en": "She was sleeping at midnight.", "he": "היא ישנה בחצות."}, {"form": "you/we/they", "en": "We were waiting for the bus.", "he": "חיכינו לאוטובוס."}, {"form": "שלילה", "en": "They weren't listening.", "he": "הם לא הקשיבו."}, {"form": "שאלה", "en": "Were you working yesterday?", "he": "עבדתם אתמול?"}, {"form": "when", "en": "I was driving when you called.", "he": "נהגתי כשהתקשרתם."}, {"form": "while", "en": "While he was reading, I cooked.", "he": "בזמן שהוא קרא, אני בישלתי."}], "tip": "לא אומרים They was playing אלא They were playing – עם you/we/they תמיד were.", "items": [{"en": "I was reading a book when you called me.", "he": "הייתי באמצע לקרוא ספר כשהתקשרתם אליי.", "focus": "was reading", "distractors": ["was read", "reading", "were reading"], "alts": []}, {"en": "They were playing football when it started to rain.", "he": "הם שיחקו כדורגל כשהתחיל לרדת גשם.", "focus": "were playing", "distractors": ["was playing", "were play", "playing"], "alts": ["They were playing soccer when it started to rain."]}, {"en": "She was cooking dinner while he was cleaning.", "he": "היא בישלה ארוחת ערב בזמן שהוא ניקה.", "focus": "was cooking", "distractors": ["cooking", "were cooking", "was cook"], "alts": []}, {"en": "What were you doing at nine last night?", "he": "מה עשיתם אתמול בתשע בערב?", "focus": "were you doing", "distractors": ["was you doing", "you were doing", "were you do"], "alts": []}, {"en": "We weren't sleeping when the alarm went off.", "he": "לא ישנו כשהאזעקה התחילה.", "focus": "weren't sleeping", "distractors": ["wasn't sleeping", "didn't sleeping", "weren't sleep"], "alts": []}, {"en": "While I was driving, I saw an accident.", "he": "בזמן שנהגתי, ראיתי תאונה.", "focus": "was driving", "distractors": ["were driving", "was drive", "driving"], "alts": ["I saw an accident while I was driving."]}, {"en": "He was talking on the phone when the boss came in.", "he": "הוא דיבר בטלפון כשהבוס נכנס.", "focus": "was talking", "distractors": ["were talking", "talking", "was talk"], "alts": []}, {"en": "Was it snowing when you left the house?", "he": "ירד שלג כשיצאתם מהבית?", "focus": "Was it snowing", "distractors": ["Were it snowing", "Did it snowing", "Was it snow"], "alts": []}, {"en": "The children were watching TV when we got home.", "he": "הילדים צפו בטלוויזיה כשהגענו הביתה.", "focus": "were watching", "distractors": ["was watching", "watching", "were watch"], "alts": []}, {"en": "I hurt my hand while I was cutting vegetables.", "he": "נפצעתי ביד בזמן שחתכתי ירקות.", "focus": "was cutting", "distractors": ["were cutting", "was cut", "cutting"], "alts": ["I hurt my hand while cutting vegetables."]}, {"en": "When the phone rang, she was having a shower.", "he": "כשהטלפון צלצל, היא הייתה במקלחת.", "focus": "rang", "distractors": ["ringed", "rung", "was ring"], "alts": ["When the phone rang, she was taking a shower.", "She was in the shower when the phone rang."]}, {"en": "You weren't listening when the teacher explained.", "he": "לא הקשבתם כשהמורה הסבירה.", "focus": "weren't listening", "distractors": ["wasn't listening", "didn't listening", "weren't listen"], "alts": []}]}, {"id": "pperfect", "level": "B1", "title": "הווה מושלם · Present Perfect", "intro": ["ה-present perfect לא קיים בעברית. הוא מחבר בין עבר להווה: משהו שקרה בעבר וחשוב עכשיו.", "המבנה: have/has + צורה שלישית של הפועל (V3): I have eaten, She has seen. has בא עם he/she/it.", "משתמשים בו לניסיון חיים (ever, never), לפעולה שזה עתה קרתה (just), ולשאלה אם משהו כבר קרה (already, yet).", "עם זמן מוגדר בעבר (yesterday, last year, ago) משתמשים בעבר פשוט: I saw it yesterday, ולא I have seen it yesterday.", "עם for ו-since הוא מתאר משהו שהתחיל בעבר ונמשך עד היום: I have lived here for ten years."], "table": [{"form": "ניסיון", "en": "I have been to London.", "he": "הייתי בלונדון (פעם)."}, {"form": "never", "en": "She has never flown.", "he": "היא אף פעם לא טסה."}, {"form": "just", "en": "We have just arrived.", "he": "בדיוק הגענו."}, {"form": "yet", "en": "Have you eaten yet?", "he": "כבר אכלתם?"}, {"form": "for / since", "en": "He has worked here since May.", "he": "הוא עובד כאן מאז מאי."}, {"form": "מול עבר פשוט", "en": "I lost my keys yesterday.", "he": "איבדתי את המפתחות אתמול."}], "tip": "לא אומרים I have seen him yesterday אלא I saw him yesterday – עם זמן מוגדר בעבר משתמשים בעבר פשוט.", "items": [{"en": "I have never been to Japan.", "he": "מעולם לא הייתי ביפן.", "focus": "have never been", "distractors": ["never was", "have never went", "never been"], "alts": []}, {"en": "Have you ever eaten sushi?", "he": "אכלתם פעם סושי?", "focus": "ever eaten", "distractors": ["ever ate", "ever eat", "ever eating"], "alts": ["Have you ever tried sushi?"]}, {"en": "She has just finished her homework.", "he": "היא בדיוק סיימה את שיעורי הבית.", "focus": "has just finished", "distractors": ["have just finished", "is just finished", "has just finish"], "alts": ["She just finished her homework."]}, {"en": "We have already seen this movie.", "he": "כבר ראינו את הסרט הזה.", "focus": "have already seen", "distractors": ["have already saw", "has already seen", "already seen"], "alts": ["We already saw this movie."]}, {"en": "He hasn't called me yet.", "he": "הוא עוד לא התקשר אליי.", "focus": "hasn't called", "distractors": ["haven't called", "hasn't call", "didn't called"], "alts": []}, {"en": "They have lived in Haifa for many years.", "he": "הם גרים בחיפה כבר הרבה שנים.", "focus": "have lived", "distractors": ["live", "are living", "has lived"], "alts": ["They have been living in Haifa for many years."]}, {"en": "Have you finished your work yet?", "he": "כבר סיימתם את העבודה?", "focus": "Have you finished", "distractors": ["Has you finished", "Did you finished", "Have you finish"], "alts": ["Did you finish your work yet?"]}, {"en": "I saw that film last week.", "he": "ראיתי את הסרט הזה בשבוע שעבר.", "focus": "saw", "distractors": ["have seen", "has seen", "seen"], "alts": ["I saw that movie last week."]}, {"en": "My sister has lost her keys again.", "he": "אחותי איבדה שוב את המפתחות שלה.", "focus": "has lost", "distractors": ["have lost", "has lose", "has losed"], "alts": ["My sister lost her keys again."]}, {"en": "I have known him since we were children.", "he": "אני מכיר אותו מאז שהיינו ילדים.", "focus": "have known", "distractors": ["know", "am knowing", "has known"], "alts": []}, {"en": "She has never driven a car.", "he": "היא אף פעם לא נהגה במכונית.", "focus": "has never driven", "distractors": ["has never drove", "have never driven", "has never drive"], "alts": []}, {"en": "We have been friends for a long time.", "he": "אנחנו חברים כבר הרבה זמן.", "focus": "have been", "distractors": ["are", "has been", "are being"], "alts": []}]}, {"id": "cond12", "level": "B1", "title": "משפטי תנאי · First & Second Conditional", "intro": ["תנאי ראשון (First Conditional) מדבר על מצב אפשרי ומציאותי בעתיד: If it rains, I will stay home.", "המבנה: If + הווה פשוט, will + פועל. שימו לב: אחרי if לא שמים will – לא If it will rain.", "תנאי שני (Second Conditional) מדבר על מצב דמיוני או לא סביר בהווה: If I had a lot of money, I would travel the world.", "המבנה: If + עבר פשוט, would + פועל. עם be אומרים לרוב were לכל הגופים: If I were you...", "בעברית: 'אם תבואו' = תנאי ראשון. 'אילו הייתם באים' = תנאי שני."], "table": [{"form": "תנאי ראשון", "en": "If you call me, I will come.", "he": "אם תתקשרו אליי, אני אבוא."}, {"form": "תנאי ראשון – שלילה", "en": "If we don't hurry, we will be late.", "he": "אם לא נמהר, נאחר."}, {"form": "תנאי שני", "en": "If I had a car, I would drive to work.", "he": "אילו הייתה לי מכונית, הייתי נוסע לעבודה."}, {"form": "If I were you", "en": "If I were you, I would rest.", "he": "במקומכם, הייתי נח."}, {"form": "שאלה", "en": "What would you do if you were rich?", "he": "מה הייתם עושים אילו הייתם עשירים?"}], "tip": "לא אומרים If I will see him אלא If I see him – אחרי if לא שמים will (ולא would).", "items": [{"en": "If it rains tomorrow, we will stay home.", "he": "אם ירד גשם מחר, נישאר בבית.", "focus": "rains", "distractors": ["will rain", "rain", "rained"], "alts": ["We will stay home if it rains tomorrow."]}, {"en": "If you study hard, you will pass the test.", "he": "אם תלמדו קשה, תעברו את המבחן.", "focus": "will pass", "distractors": ["would passed", "will passing", "passed"], "alts": []}, {"en": "If I had more money, I would buy a house.", "he": "אילו היה לי יותר כסף, הייתי קונה בית.", "focus": "had", "distractors": ["have   const praise=SES.combo>=5?pick(["אי אפשר לעצור אתכם!","איזה רצף!","אתם על זה!"]):pick(["מצוין!","יפה מאוד!","נכון!","כל הכבוד!","מעולה!"]);
  let ans=`<span class="en">${esc(e.p.en)}</span>`;
  if(!ok&&SES.given&&WHYK.has(e.kind)&&!e.noWhy&&!/[\u0590-\u05FF]/.test(SES.given)&&words(SES.given).length){const bd=bestDiff(e.p,SES.given);ans=`<span class="en">${hlTarget(bd.t,bd.flags)}</span>`}
  if(ok)fb.innerHTML=`<h3>${info.speak&&info.score<1?"כמעט!":praise}</h3>${info.alt?`<p>נכון. דרך נוספת לומר את זה: ${ans}</p>`:info.typo?`<p>שימו לב לאיות: ${ans}</p>`:info.speak&&info.score<1?`<p>את המילים שבאדום לא שמענו טוב. נסו לומר אותן ברור יותר בפעם הבאה.</p>`:(e.kind==="sayit"||e.kind==="type"||e.kind==="bank"||e.kind==="dictate"||e.kind==="word"||e.kind==="wordtype")?`<p>${ans}</p>`:""}`;
  else if(e.kind==="listen")fb.innerHTML=`<h3>לא בדיוק</h3><p>שמעתם: ${ans}</p><p>${esc(e.p.he)}</p>`;
  else fb.innerHTML=`<h3>${info.skipped?"נחזור לזה בהמשך":info.near?"כמעט! יש טעות באיות":"לא בדיוק"}</h3><p>התשובה הנכונה: ${e.kind==="readmean"?esc(e.p.he):e.kind==="gap"?`<span class="en">${esc(e.word)}</span>`:ans}</p>${info.speak?`<p class="muted" style="font-size:14px">אפשר להקשיב ולנסות שוב כשהמשפט יחזור בסוף השלב.</p>`:""}`;
  if(!ok&&e.kind!=="readmean")fb.insertAdjacentHTML("beforeend",`<button class="ic sm" style="margin-top:6px" data-say2="1" aria-label="השמעת התשובה">${ICON.speaker}</button>`);
  fb.innerHTML=`<div class="fb-row"><span class="fb-ic m">${mascot(ok?"cheer":"sad",54)}</span><div>${fb.innerHTML}</div></div>`;
  const b2=fb.querySelector("[data-say2]");if(b2)b2.onclick=()=>say(e.p.en,false,b2);
  if(ok&&(e.kind==="sayit"||e.kind==="bank"||e.kind==="type"||e.kind==="word"||e.kind==="wordtype"))setTimeout(()=>say(e.p.en),150);
  if(!ok&&!info.skipped&&SES.given&&WHYK.has(e.kind)&&!e.noWhy)setTimeout(()=>showWhy(e,SES.given),RM()?0:280);
  // retry wrong ones once at the end
  SES.queue.shift();
  if(ok||SES.retried.has(e)||SES.jumpTo!=null){SES.done++}else{SES.retried.add(e);SES.queue.push(e)}
  if(!ok&&!SES.missed.some(x=>x.id===e.p.id))SES.missed.push(e.p);
  SES.bestCombo=Math.max(SES.bestCombo||0,SES.combo||0);
  let btn=$("#check")||$("#skip");
  btn.outerHTML=`<button class="btn primary" id="cont">המשך</button>`;
  const c=$("#cont");c.onclick=next;c.focus();
  const bar=document.querySelector(".pbar i");if(bar&&!SES.placement){const pv=Math.round(SES.done/SES.total*100);bar.style.width=pv+"%";bar.parentNode.setAttribute("aria-valuenow",pv)}
}
function next(){if(!SES.queue.length)return finishSession();
  const w=document.querySelector(".l-body .wrap");if(!w||RM()){renderEx();return}
  w.classList.remove("ex-in");w.classList.add("ex-out");setTimeout(renderEx,190)}
document.addEventListener("keydown",ev=>{if(view==="lesson"&&SES&&!SES.answered&&!document.querySelector(".sheet")&&/^[1-4]$/.test(ev.key)&&!/TEXTAREA|INPUT/.test(document.activeElement.tagName)){const o=document.querySelectorAll("[data-opt]")[+ev.key-1];if(o){ev.preventDefault();o.click()}}
  if(document.querySelector(".sheet"))return;
  if(view==="lesson"&&ev.key==="Escape"){ev.preventDefault();quitConfirm();return}
  if(view!=="lesson"||ev.key!=="Enter")return;if(ev.target.closest&&ev.target.closest("button,textarea,select,input"))return;const c=$("#cont");if(c){ev.preventDefault();c.click()}});
function quitConfirm(){
  if(document.querySelector(".sheet"))return;stopMic();
  const {el,close}=mkSheet(`<div style="display:flex;gap:14px;align-items:center">${mascot("sad",72)}<div><h2 style="font-size:22px">לצאת עכשיו?</h2><p class="muted" style="margin:4px 0 0">מה שעשיתם בתרגול הזה לא יישמר.</p></div></div>
    <button class="btn primary wide" id="stay">ממשיכים ללמוד</button><button class="btn wide" id="leave" style="color:var(--bad)">יציאה</button>`,"לצאת מהתרגול?");
  el.querySelector("#stay").onclick=close;
  el.querySelector("#leave").onclick=()=>{close();unsubs.forEach(u=>{try{u()}catch(e){}});SES=null;view=S.onboarded?"home":"onboard";render()};
}
function finishPlacement(lvl,best,speakTested){
  const SES_FAILED=!!(SES&&SES.failedAt!=null);
  unsubs.forEach(u=>{try{u()}catch(e){}});
  onb.start=lvl;SES=null;view="onboard";onb.step=2;render();
  best=best||{};const SK=[["read","קריאה"],["listen","האזנה"],["write","כתיבה"],["speak","דיבור"]];
  const top=Math.max(0,...SK.map(([k])=>best[k]??-1));
  const rows=SK.map(([k,l])=>{if(k==="speak"&&!speakTested)return `<div class="pl-row"><span>${l}</span><div class="muted" style="font-size:14px;font-weight:400;grid-column:span 2">לא נבדק: במכשיר הזה אין זיהוי דיבור. במחשב עם Chrome או Edge המבחן יבדוק גם דיבור.</div></div>`;
    const b=best[k]??-1;return `<div class="pl-row"><span>${l}</span><div class="pl-bar"><i style="width:${(b+1)/LEVELS.length*100}%"></i></div><b class="en">${b>=0?LEVELS[b].code:"–"}</b></div>`}).join("");
  const gap=top-lvl>=2;
  const h=document.querySelector(".onb h1");if(h)h.insertAdjacentHTML("afterend",`<div class="banner pl"><div>מומלץ להתחיל ברמה <bdi class="en">${LEVELS[lvl].code}</bdi> (${LEVELS[lvl].name}). ${lvl===0?"מתחילים מההתחלה, כדי לבנות בסיס חזק בכתיבה ובדיבור.":lvl===LEVELS.length-1&&!SES_FAILED?"עברתם את כל הרמות!":`עברתם את רמה <bdi class="en">${LEVELS[lvl-1].code}</bdi> בכל המיומנויות, אז ממשיכים לרמה הבאה.`} הרמה נקבעת לפי שילוב של כל המיומנויות, לא לפי החזקה שבהן.</div>${rows}
   ${gap?`<div>ההבנה שלכם טובה יותר מהדיבור והכתיבה. זה נפוץ מאוד, והמסלול יתמקד בדיוק בזה: 60% מכל שלב הוא דיבור.</div>`:""}<div class="muted" style="font-size:14px">אפשר גם לבחור רמה אחרת מהרשימה שלמטה.</div></div>`);
}
let lastResult=null;
function finishSession(){
  unsubs.forEach(u=>{try{u()}catch(e){}});
  const jumpFail=SES.jumpTo!=null&&SES.mistakes>2;
  const comboB=(SES.bestCombo||0)>=10?10:(SES.bestCombo||0)>=5?5:0,dbl=!jumpFail&&S.dbl;
  const base=jumpFail?SES.firstTry:10+SES.firstTry+(SES.mistakes===0?5:0)+comboB,xp=dbl?base*2:base;if(dbl)S.dbl=0;
  const lvl0=lvlOf(S.xp),st0=S.streak;let froze=0;
  const stars=SES.mistakes===0?3:SES.mistakes<=2?2:1;
  const t=today(),wasGoal=todayLessons()>=S.goal;
  if(!jumpFail&&S.lastDay!==t){
    const gap=S.lastDay?Math.round((new Date(t+"T12:00")-new Date(S.lastDay+"T12:00"))/864e5)-1:0; // full days missed
    if(S.lastDay===dayOffset(-1))S.streak++;
    else if(gap>0&&gap<=(S.freeze||0)&&S.streak>0){S.freeze-=gap;froze=gap;S.streak++}
    else S.streak=1;
    S.lastDay=t}
  S.best=Math.max(S.best||0,S.streak);
  const d=S.days[t]||{xp:0,l:0};d.xp+=xp;if(!jumpFail){d.l+=1;if(SES.mistakes===0)d.perfect=(d.perfect||0)+1}d.oral=(d.oral||0)+SES.oral;S.days[t]=d;
  const cutoff=dayOffset(-35);Object.keys(S.days).forEach(k=>{if(k<cutoff)delete S.days[k]});
  S.xp+=xp;S.coins=(S.coins||0)+xp;
  const lvl1=lvlOf(S.xp),MS=[3,7,14,30,50,100,365],milestone=S.streak>st0&&MS.includes(S.streak)?S.streak:0;
  const surprise=!jumpFail&&Math.random()<.35;
  const locked=ALL.filter((x,i)=>lessonState(i)==="locked").map(x=>x.id);
  if(SES.gram){S.gdone=S.gdone||{};const gk=SES.gram.id+"."+SES.gram.k;S.gdone[gk]=Math.max(S.gdone[gk]||0,stars)}
  if(SES.lesson){if(!S.done[SES.lesson.id])JUST={done:SES.lesson.id,wasLocked:locked};S.done[SES.lesson.id]=Math.max(S.done[SES.lesson.id]||0,stars)}
  save();
  let jump=null;if(SES.jumpTo!=null){jump={pass:SES.mistakes<=2};if(jump.pass){S.jump=Math.max(S.jump??-1,SES.jumpTo);JUST={done:null,wasLocked:locked};save()}}
  lastResult={xp,stars,acc:Math.round(SES.firstTry/SES.total*100),title:SES.title,goalNow:!wasGoal&&todayLessons()>=S.goal,lesson:!!SES.lesson,gram:SES.gram||null,missed:SES.missed.slice(0,5),combo:SES.bestCombo||0,jump,comboB,dbl:!!dbl,froze,levelUp:lvl1>lvl0?lvl1:0,milestone,surprise};
  SES=null;view="result";render();sfxWin();confetti();if(checkUpdate.pending)setTimeout(checkUpdate,8000);
}
function celebrate(r){
  const big=r.levelUp?`<div class="cel-num">${r.levelUp}</div><h2>עליתם לרמה ${r.levelUp}!</h2><p class="muted">עוד ${lvlStart(r.levelUp+1)-S.xp} נקודות לרמה הבאה.</p>`
    :`<div class="cel-num">🔥 ${r.milestone}</div><h2>${r.milestone} ימים ברצף!</h2><p class="muted">${r.milestone>=30?"זה כבר הרגל אמיתי. מרשים!":r.milestone>=7?"שבוע שלם! ככה לומדים שפה.":"התחלה מצוינת. ממשיכים מחר!"}</p>`;
  const {el,close}=mkSheet(`<div class="cel">${mascot("cheer",120)}${big}<button class="btn primary wide" id="cel-ok">יש!</button></div>`,"חגיגה");
  el.querySelector("#cel-ok").onclick=close;sfxWin();confetti();
  if(r.levelUp&&r.milestone)el.querySelector("#cel-ok").onclick=()=>{close();setTimeout(()=>celebrate({milestone:r.milestone}),300)};
}
function renderResult(){
  const r=lastResult,j=r.jump;
  const head=j?(j.pass?"עברתם! היחידה נפתחה":"עוד לא הפעם"):(r.stars===3?"שלב מושלם!":"השלב הושלם!");
  app.innerHTML=`<div class="onb gut result">${mascot(j&&!j.pass?"sad":r.stars>=2||j?"cheer":"happy",104)}
   ${j?"":`<div class="big-stars" role="img" aria-label="${r.stars} כוכבים מתוך 3">${[0,1,2].map(i=>`<span class="${i<r.stars?"":"off"}">★</span>`).join("")}</div>`}
   <h1>${head}</h1><p class="muted">${esc(r.title).replace(/^(\S+) · /,'<bdi class="en">$1</bdi> · ')}${!j&&r.stars<3?". שלושה כוכבים מקבלים על שלב בלי אף טעות":""}${j&&!j.pass?". אפשר להמשיך לפי הסדר או לנסות שוב מתי שרוצים.":""}</p>
   ${r.comboB||r.dbl||r.froze?`<div class="perks">${r.dbl?`<span class="perk">⚡ נקודות כפולות!</span>`:""}${r.comboB?`<span class="perk">🔥 בונוס רצף תשובות +${r.comboB}</span>`:""}${r.froze?`<span class="perk">🧊 הקפאת רצף שמרה על הרצף שלכם</span>`:""}</div>`:""}
   ${r.surprise?`<button class="surprise" id="r-box" aria-label="פתחו את תיבת ההפתעה">${ICON.chest}<span>תיבת הפתעה! לחצו לפתיחה</span></button>`:""}
   ${r.goalNow?`<div class="banner">היעד היומי הושלם! הרצף עומד על ${S.streak} ${S.streak===1?"יום":"ימים"}.</div>`:""}
   <div class="res-nums"><div class="num"><b id="rc-xp" class="en" style="text-align:center">+0</b><span>נקודות</span></div><div class="num"><b id="rc-acc">0%</b><span>נכון בניסיון ראשון</span></div><div class="num"><b>${r.combo}</b><span>רצף תשובות שיא</span></div><div class="num"><b id="rc-st">${shownStreak()}</b><span>ימים ברצף</span></div></div>
   ${r.missed.length?`<div class="review"><h3>כדאי לחזור על ${r.missed.length===1?"המשפט הזה":"המשפטים האלה"}</h3>${r.missed.map(p=>`<div class="ph"><button class="ic sm" data-say="${esc(p.en)}" aria-label="השמעה">${ICON.speaker}</button><div><span class="en" lang="en">${esc(p.en)}</span><span class="he">${esc(p.he)}</span></div></div>`).join("")}</div>`:""}
   ${claimable()?`<div class="banner">משימה יומית הושלמה! התיבה מחכה בלשונית "משימות".</div>`:""}
   ${r.gram?(r.gram.k<(String(r.gram.id).startsWith("s:")?(DICT?1:0):2)?`<button class="btn primary wide" id="r-gnext">לתרגול הבא בפרק</button>`:""):currentIdx()>=0?`<button class="btn primary wide" id="r-next">לשלב הבא</button>`:""}
   <button class="btn wide" id="r-home">חזרה למסלול</button></div>`;
  lastViewKey="result";const rh=document.querySelector(".result h1");if(rh){rh.tabIndex=-1;setTimeout(()=>rh.focus({preventScroll:true}),50)}
  setTimeout(()=>{countUp($("#rc-xp"),0,r.xp,900,v=>"+"+v);countUp($("#rc-acc"),0,r.acc,900,v=>v+"%")},RM()?0:700);
  app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say,false,b));
  const bx=$("#r-box");if(bx)bx.onclick=()=>{if(bx.dataset.done)return;bx.dataset.done=1;bx.classList.add("opening");vib([20,40,30]);tone([[523,0,.1],[784,.08,.1],[1046,.16,.25]]);
    const roll=Math.random();let msg;
    if(roll<.2&&(S.freeze||0)<2){S.freeze=(S.freeze||0)+1;msg="🧊 קיבלתם הקפאת רצף! אם תפספסו יום, הרצף יישמר."}
    else if(roll<.35){S.dbl=1;msg="⚡ נקודות כפולות בשלב הבא!"}
    else{const n=[10,15,20,25,30,50][Math.floor(Math.random()*6)];addXP(n);msg=`🎁 +${n} נקודות!`}
    save();setTimeout(()=>{bx.classList.remove("opening");bx.classList.add("opened");bx.innerHTML=`<span>${msg}</span>`;confetti()},RM()?0:650)};
  if(r.levelUp||r.milestone)setTimeout(()=>celebrate(r),RM()?100:1400);
  const n=$("#r-next");if(n)n.onclick=()=>startLesson(currentIdx());
  const gn=$("#r-gnext");if(gn)gn.onclick=()=>String(r.gram.id).startsWith("s:")?startSound(r.gram.id.slice(2),r.gram.k+1):startGrammar(r.gram.id,r.gram.k+1);
  if(r.gram)$("#r-home").textContent="חזרה לפרק";
  $("#r-home").onclick=()=>{view="home";tab=r.gram?"grammar":"path";if(r.gram)GCH=r.gram.id;renderHome.scrolled=0;lastViewKey="";render()};
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#fx");c.hidden=false;const x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement);const cols=["--accent","--speak","--read","--write","--gold"].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:120},()=>({x:c.width/2,y:c.height*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,s:Math.random()*7+4,c:pick(cols),r:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(++f<110)requestAnimationFrame(tick);else{x.clearRect(0,0,c.width,c.height);c.hidden=true}})();
}
